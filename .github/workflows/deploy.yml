name: Build and Deploy Email Backend

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Manual trigger

jobs:
  build-and-deploy:
    runs-on: self-hosted
    
    steps:
      # Step 1: Checkout code from repository
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Change to your Node version (18, 20, 22, etc.)
          cache: 'npm'
      
      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install
      
      # Step 4: Run tests (optional - remove if no tests)
      - name: Run tests
        run: npm test
        continue-on-error: true  # Continue even if tests fail
      
      # Step 5: Build project (if you have build script)
      - name: Build project
        run: npm run build
        continue-on-error: true  # Skip if no build script exists
      
      # Step 6: Stop the application (if running)
      - name: Stop application
        run: |
          echo "Stopping application if running..."
          # Add your stop command here if needed
          # For example: Stop-Process -Name "node" -Force -ErrorAction SilentlyContinue
        continue-on-error: true
      
      # Step 7: Create deployment directory if it doesn't exist
      - name: Create deployment directory
        run: |
          if (!(Test-Path "D:\iisapplications\Emailagent")) {
            New-Item -ItemType Directory -Path "D:\iisapplications\Emailagent" -Force
            echo "Created directory: D:\iisapplications\Emailagent"
          } else {
            echo "Directory already exists: D:\iisapplications\Emailagent"
          }
      
      # Step 8: Backup existing deployment (optional but recommended)
      - name: Backup existing deployment
        run: |
          $backupPath = "D:\iisapplications\Emailagent_backup_$(Get-Date -Format 'yyyyMMdd_HHmmss')"
          if (Test-Path "D:\iisapplications\Emailagent\*") {
            Copy-Item -Path "D:\iisapplications\Emailagent\*" -Destination $backupPath -Recurse -Force
            echo "Backup created at: $backupPath"
          } else {
            echo "No existing files to backup"
          }
        continue-on-error: true
      
      # Step 9: Deploy to target directory
      - name: Deploy to D:\iisapplications\Emailagent
        run: |
          echo "Deploying to D:\iisapplications\Emailagent..."
          
          # Copy all files except node_modules, .git, and other unnecessary files
          $excludeDirs = @('node_modules', '.git', '.github', 'tests', 'coverage')
          
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Exclude $excludeDirs | 
            Copy-Item -Destination "D:\iisapplications\Emailagent" -Recurse -Force
          
          echo "Deployment completed!"
      
      # Step 10: Install production dependencies in deployment directory
      - name: Install production dependencies
        run: |
          cd D:\iisapplications\Emailagent
          npm install --production
          echo "Production dependencies installed"
      
      # Step 11: Start the application (optional)
      - name: Start application
        run: |
          cd D:\iisapplications\Emailagent
          # Add your start command here
          # For example: Start-Process -FilePath "node" -ArgumentList "server.js" -WindowStyle Hidden
          echo "Application ready to start"
        continue-on-error: true
      
      # Step 12: Deployment summary
      - name: Deployment Summary
        run: |
          echo "================================"
          echo "DEPLOYMENT SUCCESSFUL ✅"
          echo "================================"
          echo "Deployed to: D:\iisapplications\Emailagent"
          echo "Time: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
          echo "Branch: $env:GITHUB_REF_NAME"
          echo "Commit: $env:GITHUB_SHA"
          echo "================================"
          
          # List deployed files
          Get-ChildItem -Path "D:\iisapplications\Emailagent" -Name