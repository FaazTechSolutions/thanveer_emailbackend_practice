name: Build and Deploy Email Backend

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Manual trigger

jobs:
  build-and-deploy:
    runs-on: self-hosted
    
    steps:
      # Step 1: Checkout code from repository
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      # Step 3: Install dependencies
      - name: Install dependencies
        shell: cmd
        run: npm install
      
      # Step 4: Run tests (optional)
      - name: Run tests
        shell: cmd
        run: npm test
        continue-on-error: true
      
      # Step 5: Build project - Creates dist folder
      - name: Build project
        shell: cmd
        run: npm run build
      
      # Step 6: Verify dist folder exists
      - name: Verify build output
        shell: powershell
        run: |
          if (Test-Path "dist") {
            Write-Host "✅ Dist folder found"
            Write-Host "Contents:"
            Get-ChildItem -Path "dist" -Recurse -Name | Select-Object -First 10
          } else {
            Write-Host "❌ Dist folder not found!"
            exit 1
          }
      
      # Step 7: Stop the application (if running)
      - name: Stop application
        shell: powershell
        run: |
          Write-Host "Stopping application if running..."
          Get-Process -Name "node" -ErrorAction SilentlyContinue | Stop-Process -Force
        continue-on-error: true
      
      # Step 8: Create deployment directory
      - name: Create deployment directory
        shell: powershell
        run: |
          if (!(Test-Path "D:\iisapplications\Emailagent")) {
            New-Item -ItemType Directory -Path "D:\iisapplications\Emailagent" -Force | Out-Null
            Write-Host "✅ Created directory: D:\iisapplications\Emailagent"
          } else {
            Write-Host "✅ Directory exists: D:\iisapplications\Emailagent"
          }
      
      # Step 9: Backup existing deployment
      - name: Backup existing deployment
        shell: powershell
        run: |
          $backupPath = "D:\iisapplications\Emailagent_backup_$(Get-Date -Format 'yyyyMMdd_HHmmss')"
          if (Test-Path "D:\iisapplications\Emailagent\*") {
            New-Item -ItemType Directory -Path $backupPath -Force | Out-Null
            Copy-Item -Path "D:\iisapplications\Emailagent\*" -Destination $backupPath -Recurse -Force
            Write-Host "✅ Backup created: $backupPath"
          } else {
            Write-Host "ℹ️ No existing files to backup"
          }
        continue-on-error: true
      
      # Step 10: Clear deployment directory (except node_modules)
      - name: Clear deployment directory
        shell: powershell
        run: |
          $targetPath = "D:\iisapplications\Emailagent"
          if (Test-Path "$targetPath\*") {
            Get-ChildItem -Path $targetPath -Exclude "node_modules" | 
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "✅ Cleared old files (kept node_modules)"
          }
        continue-on-error: true
      
      # Step 11: Extract and deploy dist contents
      - name: Deploy dist contents to root
        shell: powershell
        run: |
          $distPath = Join-Path $env:GITHUB_WORKSPACE "dist"
          $targetPath = "D:\iisapplications\Emailagent"
          
          Write-Host "📦 Extracting dist contents..."
          Write-Host "Source: $distPath"
          Write-Host "Target: $targetPath"
          
          if (Test-Path $distPath) {
            # Copy everything from inside dist folder to target root
            Copy-Item -Path "$distPath\*" -Destination $targetPath -Recurse -Force
            
            Write-Host "✅ Dist contents extracted successfully"
            Write-Host ""
            Write-Host "Deployed structure:"
            Get-ChildItem -Path $targetPath -Name | Where-Object { $_ -ne "node_modules" }
          } else {
            Write-Host "❌ Error: dist folder not found at $distPath"
            exit 1
          }
      
      # Step 12: Copy package.json
      - name: Copy package.json
        shell: powershell
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "package.json"
          $destination = "D:\iisapplications\Emailagent\package.json"
          
          if (Test-Path $source) {
            Copy-Item -Path $source -Destination $destination -Force
            Write-Host "✅ package.json copied"
          } else {
            Write-Host "❌ package.json not found"
            exit 1
          }
      
      # Step 13: Copy package-lock.json (optional)
      - name: Copy package-lock.json
        shell: powershell
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "package-lock.json"
          $destination = "D:\iisapplications\Emailagent\package-lock.json"
          
          if (Test-Path $source) {
            Copy-Item -Path $source -Destination $destination -Force
            Write-Host "✅ package-lock.json copied"
          } else {
            Write-Host "⚠️ package-lock.json not found (optional)"
          }
        continue-on-error: true
      
      # Step 14: Install production dependencies
      - name: Install production dependencies
        shell: cmd
        run: |
          cd /d D:\iisapplications\Emailagent
          npm install --production
      
      # Step 15: Verify deployment
      - name: Verify deployment structure
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "📂 Final deployment structure:"
          Get-ChildItem -Path "D:\iisapplications\Emailagent" -Name
          Write-Host ""
          
          # Check key files
          $requiredFiles = @("server.js", "package.json")
          foreach ($file in $requiredFiles) {
            if (Test-Path "D:\iisapplications\Emailagent\$file") {
              Write-Host "✅ $file exists"
            } else {
              Write-Host "❌ $file missing"
            }
          }
      
      # Step 16: Start application (optional)
      - name: Start application
        shell: powershell
        run: |
          Set-Location "D:\iisapplications\Emailagent"
          Write-Host "✅ Ready to start application"
          Write-Host ""
          Write-Host "To start manually, run:"
          Write-Host "  cd D:\iisapplications\Emailagent"
          Write-Host "  node server.js"
          
          # Uncomment to auto-start:
          # Start-Process -FilePath "node" -ArgumentList "server.js" -WorkingDirectory "D:\iisapplications\Emailagent"
        continue-on-error: true
      
      # Step 17: Deployment summary
      - name: Deployment Summary
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "═══════════════════════════════════════════════"
          Write-Host "         DEPLOYMENT SUCCESSFUL ✅              "
          Write-Host "═══════════════════════════════════════════════"
          Write-Host ""
          Write-Host "📁 Location: D:\iisapplications\Emailagent"
          Write-Host "⏰ Time: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
          Write-Host "🌿 Branch: $env:GITHUB_REF_NAME"
          Write-Host "📝 Commit: $($env:GITHUB_SHA.Substring(0,7))"
          Write-Host ""
          Write-Host "📦 Deployed from dist:"
          Write-Host "   • server.js"
          Write-Host "   • helper/"
          Write-Host "   • db/"
          Write-Host "   • utils/"
          Write-Host "   • package.json"
          Write-Host "   • node_modules/"
          Write-Host ""
          Write-Host "═══════════════════════════════════════════════"