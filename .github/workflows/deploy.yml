name: Build and Deploy Email Backend 

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        shell: cmd
        run: npm install

      - name: Build project
        shell: cmd
        run: npm run build

      - name: Generate .env from GitHub secrets
        shell: powershell
        run: |
          $envPath = "$env:GITHUB_WORKSPACE\.env"
          Remove-Item $envPath -ErrorAction SilentlyContinue

          Add-Content -Path $envPath -Value "AI_MODEL=${{ secrets.AI_MODEL }}"
          Add-Content -Path $envPath -Value "ANALYZER_AI_MODEL=${{ secrets.ANALYZER_AI_MODEL }}"
          Add-Content -Path $envPath -Value "API_TOKEN=${{ secrets.API_TOKEN }}"
          Add-Content -Path $envPath -Value "DATABASE_URL=${{ secrets.DATABASE_URL }}"
          Add-Content -Path $envPath -Value "MSSQL_CONNECTION_STRING=${{ secrets.MSSQL_CONNECTION_STRING }}"
          Add-Content -Path $envPath -Value "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"
          Add-Content -Path $envPath -Value "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}"
          Add-Content -Path $envPath -Value "NODE_ENV=production"

          Write-Host "OK: .env generated from GitHub secrets"

      - name: Verify dist exists
        shell: powershell
        run: |
          if (!(Test-Path "dist")) {
            Write-Host "ERROR: dist folder missing!" -ForegroundColor Red
            exit 1
          }
          Write-Host "OK: dist folder exists"

      - name: Stop application
        shell: powershell
        run: |
          Get-Process -Name "node" -ErrorAction SilentlyContinue | Stop-Process -Force
        continue-on-error: true

      - name: Create deployment directory
        shell: powershell
        run: |
          if (!(Test-Path "D:\iisapplications\Emailagent")) {
            New-Item -ItemType Directory -Path "D:\iisapplications\Emailagent" -Force
          }

      - name: Backup existing deployment
        shell: powershell
        run: |
          $timestamp = Get-Date -Format 'yyyyMMdd_HHmmss'
          $backup = "D:\iisapplications\Emailagent_backup_$timestamp"

          if (Test-Path "D:\iisapplications\Emailagent\*") {
            New-Item -ItemType Directory -Path $backup -Force | Out-Null
            Copy-Item "D:\iisapplications\Emailagent\*" $backup -Recurse -Force
            Write-Host ("Backup created at {0}" -f $backup)
          }

      - name: Clear deployment directory
        shell: powershell
        run: |
          $path = "D:\iisapplications\Emailagent"
          Get-ChildItem -Path $path -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Deployment folder cleared"

      - name: Deploy dist contents
        shell: powershell
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          Copy-Item "$dist\*" "D:\iisapplications\Emailagent" -Recurse -Force
          Write-Host "dist deployed"

      - name: Deploy package.json
        shell: powershell
        run: |
          Copy-Item "$env:GITHUB_WORKSPACE\package.json" "D:\iisapplications\Emailagent\package.json" -Force
          Write-Host "package.json deployed"

      - name: Deploy package-lock.json
        shell: powershell
        run: |
          if (Test-Path "$env:GITHUB_WORKSPACE\package-lock.json") {
            Copy-Item "$env:GITHUB_WORKSPACE\package-lock.json" "D:\iisapplications\Emailagent\package-lock.json" -Force
            Write-Host "package-lock.json deployed"
          }

      - name: Deploy new .env file
        shell: powershell
        run: |
          Copy-Item "$env:GITHUB_WORKSPACE\.env" "D:\iisapplications\Emailagent\.env" -Force
          Write-Host ".env deployed"

      - name: Install production dependencies
        shell: cmd
        run: |
          cd /d D:\iisapplications\Emailagent
          npm install --production

      - name: Verify deployment structure
        shell: powershell
        run: |
          Write-Host "=============================="
          Write-Host "Deployment Contents:"
          Write-Host "=============================="
          Get-ChildItem "D:\iisapplications\Emailagent" | Format-Table Name, Length, LastWriteTime

          $criticalFiles = @(
            @{Path=".env"; Description="Environment variables"},
            @{Path="package.json"; Description="Package configuration"},
            @{Path="server.js"; Description="Server entry file"}
          )

          $allPresent = $true
          foreach ($file in $criticalFiles) {
            $full = Join-Path "D:\iisapplications\Emailagent" $file.Path
            if (Test-Path $full) {
              Write-Host ("[OK] {0}" -f $file.Path)
            } else {
              Write-Host ("[MISS] {0}" -f $file.Path)
              $allPresent = $false
            }
          }

          if (-not $allPresent) {
            Write-Host "Some critical files missing"
          }

      - name: Deployment Summary
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host " DEPLOYMENT COMPLETED SUCCESSFULLY"
          Write-Host "======================================"
          Write-Host ("Deployment Path: {0}" -f "D:\iisapplications\Emailagent")
          Write-Host ("Timestamp: {0}" -f (Get-Date -Format 'yyyy-MM-dd HH:mm:ss'))
